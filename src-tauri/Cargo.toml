[package]
name = "fastsheet"
version = "0.3.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "fastsheet"
# Disable binary auto-discovery: every target is declared explicitly
# below so a stray `src/bin/*.rs` debug script can never be compiled into
# a release build / installer. The dev CLIs are gated behind `dev-bins`.
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Dev-only diagnostic CLIs (probe / save_probe / trace_probe) compile
# ONLY with this feature, so `cargo build --release` and `tauri build`
# leave them out of the installer + portable runtime — the GUI app
# (fastsheet.exe) is the only binary that ships. Use them in dev with
# e.g. `cargo run --release --features dev-bins --bin probe -- <file>`.
dev-bins = []

[[bin]]
name = "fastsheet"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"
required-features = ["dev-bins"]

[[bin]]
name = "save_probe"
path = "src/bin/save_probe.rs"
required-features = ["dev-bins"]

[[bin]]
name = "trace_probe"
path = "src/bin/trace_probe.rs"
required-features = ["dev-bins"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fastsheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ironcalc = { path = "../vendor/ironcalc" }
ironcalc_base = { path = "../vendor/base" }
zip = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
calamine = "0.26"
cfb = "0.10"

